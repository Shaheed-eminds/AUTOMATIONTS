# Mirrors .github/workflows/ci.yml — runs the BDD suite on push/PR to main.
#
# Email notification (the GitHub workflow's SMTP step) is intentionally
# left out for now — can be added once the basic run is green.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Set up Node.js'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npx playwright install --with-deps
    displayName: 'Install Playwright browsers'

  - script: |
      npx bddgen
      npx playwright test
    displayName: 'Run Playwright tests'
    env:
      # playwright.config.ts picks headless mode off process.env.CI. GitHub
      # Actions sets that automatically; Azure Pipelines doesn't, so every
      # browser launch was trying to open headed with no display and dying
      # instantly ("Missing X server or $DISPLAY"). Setting it here fixes
      # headless mode and also activates the config's CI-tuned retries/workers.
      CI: true

  - script: |
      if [ -d "reports/html-report" ]; then
        zip -r html-report.zip reports/html-report
      else
        echo "No HTML report directory found; skipping zip."
      fi
    condition: always()
    displayName: 'Zip HTML report'

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'reports/html-report'
      artifact: 'playwright-html-report'
    displayName: 'Publish HTML report artifact'
